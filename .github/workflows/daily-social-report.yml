name: Social Report (Every 12 Hours)

on:
  schedule:
    # 02:30 UTC = 08:00 IST
    - cron: '30 2 * * *'
    # 14:30 UTC = 20:00 IST
    - cron: '30 14 * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    name: Run scraper
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Verify required secrets are configured
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |
          missing=()
          [ -z "$APIFY_API_TOKEN" ] && missing+=("APIFY_API_TOKEN")
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Missing required GitHub secrets: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "All required secrets are present."

      - name: Run scraper
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REDDIT_ACTOR_ID: ${{ secrets.REDDIT_ACTOR_ID }}
          TWITTER_ACTOR_ID: ${{ secrets.TWITTER_ACTOR_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          LOG_LEVEL: info
        run: npm run scrape

      - name: Upload scraper output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-result
          path: |
            output/daily-scraper-result.json
            output/daily-scraper-result.xlsx
          if-no-files-found: warn
          retention-days: 14

      - name: Email report
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Social Report <${{ secrets.GMAIL_ADDRESS }}>
          to: sayandeep@hydradb.com, reachsayandeep@gmail.com
          subject: Social Report (12h) - ${{ github.run_id }}
          body: Attached is the latest 12-hour social report (one sheet per platform).
          attachments: output/daily-scraper-result.xlsx
